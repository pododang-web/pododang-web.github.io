<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#f7f6f2">
    <meta name="description" content="포도당은 평등·연대·민주주의를 바탕으로 시민의 자유와 권리를 보장하고, 차별 없는 민주적 공동체를 지향합니다.">
    <title>포도당 | 평등과 연대로, 모두의 권리를</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="wrap header-inner">
            <a class="brand" href="index.html" aria-label="포도당 홈">
                <img src="img/logo-transparent.png" alt="포도당">
            </a>
            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="메뉴 열기">
                <span></span><span></span>
            </button>
            <nav class="nav" id="primary-navigation" aria-label="주요 메뉴">
                <a href="charter.html">당헌</a>
                <a href="basic-principles.html">기본 이념</a>
                <a href="platform.html">강령</a>
                <a href="organization.html">조직도</a>
                <a class="nav-join" href="charter.html#article-1">창당 목적 <span aria-hidden="true">↗</span></a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero" id="home">
            <div class="wrap hero-grid">
                <div>
                    <span class="eyebrow">창당 목적</span>
                    <h1>평등과 연대로,<br><span>모두의 권리를.</span></h1>
                    <p class="hero-copy">포도당은 평등·연대·민주주의의 가치를 실현하고 시민의 자유와 권리를 보장합니다. 사회적 불평등과 차별을 해소해 정의롭고 평등한 공동체를 만들어갑니다.</p>
                    <div class="hero-actions">
                        <a class="button button-dark" href="basic-principles.html">기본 이념 보기 <span aria-hidden="true">↗</span></a>
                        <a class="text-link" href="charter.html">당헌 원문 보기 <span aria-hidden="true">→</span></a>
                    </div>
                </div>
                <div class="hero-art" aria-label="포도당 로고">
                    <span class="side-note" aria-hidden="true">평등과 연대<br>민주적 공동체</span>
                    <div class="orbit" aria-hidden="true"></div>
                    <div class="logo-card"><img src="img/logo-transparent.png" alt=""></div>
                    <span class="orbit-note">평등 · 연대 · 민주주의</span>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap footer-inner">
            <div class="footer-brand">
                <img src="img/logo-transparent.png" alt="포도당">
                <span>평등 · 연대 · 민주주의</span>
            </div>
            <p class="copyright">포도당<br>© 포도당. All rights reserved.</p>
        </div>
    </footer>
    <script>
        const menuToggle = document.querySelector(".menu-toggle");
        const navigation = document.querySelector("#primary-navigation");

        menuToggle.addEventListener("click", () => {
            const isOpen = menuToggle.getAttribute("aria-expanded") === "true";
            menuToggle.setAttribute("aria-expanded", String(!isOpen));
            menuToggle.setAttribute("aria-label", isOpen ? "메뉴 열기" : "메뉴 닫기");
            navigation.classList.toggle("is-open", !isOpen);
        });

        navigation.addEventListener("click", (event) => {
            if (event.target.closest("a")) {
                menuToggle.setAttribute("aria-expanded", "false");
                menuToggle.setAttribute("aria-label", "메뉴 열기");
                navigation.classList.remove("is-open");
            }
        });
    </script>
</body>
</html>
