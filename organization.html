    <script>
        const organizationNodes = document.querySelectorAll(".org-node");
        const organizationDetail = document.querySelector("#org-detail");

        organizationNodes.forEach((node) => {
            node.addEventListener("click", () => {
                if (node.matches(".org-node-branch")) {
                    const isExpanded = node.getAttribute("aria-expanded") === "true";
                    node.setAttribute("aria-expanded", String(!isExpanded));
                    document.getElementById(node.getAttribute("aria-controls")).hidden = isExpanded;
                }

                organizationNodes.forEach((item) => {
                    item.classList.remove("is-selected");
                    if (!item.matches(".org-node-branch")) {
                        item.setAttribute("aria-pressed", "false");
                    }
                });
                node.classList.add("is-selected");
                if (!node.matches(".org-node-branch")) {
                    node.setAttribute("aria-pressed", "true");
                }
                organizationDetail.querySelectorAll(":scope > div").forEach((section) => {
                    section.hidden = true;
                });

                if (node.dataset.kind === "position") {
                    const person = organizationDetail.querySelector(".org-detail-person");
                    person.hidden = false;
                    person.querySelector("h2").textContent = node.dataset.title;
                    person.querySelector(".org-detail-name").textContent = node.dataset.person;
                } else if (node.dataset.kind === "staffed-organization") {
                    const organization = organizationDetail.querySelector(".org-detail-manager");
                    organization.hidden = false;
                    organization.querySelector("h2").textContent = node.dataset.title;
                    organization.querySelector(".org-detail-manager-description").textContent = node.dataset.description;
                    organization.querySelector(".org-detail-name").textContent = node.dataset.person;
                } else {
                    const organization = organizationDetail.querySelector(".org-detail-description");
                    organization.hidden = false;
                    organization.querySelector("h2").textContent = node.dataset.title;
                    organization.querySelector("p:last-child").textContent = node.dataset.description;
                }

                organizationDetail.hidden = false;
            });
        });

        const menuToggle = document.querySelector(".menu-toggle");
        const navigation = document.querySelector("#primary-navigation");

        menuToggle.addEventListener("click", () => {
            const isOpen = menuToggle.getAttribute("aria-expanded") === "true";
            menuToggle.setAttribute("aria-expanded", String(!isOpen));
            menuToggle.setAttribute("aria-label", isOpen ? "메뉴 열기" : "메뉴 닫기");
            navigation.classList.toggle("is-open", !isOpen);
        });

        navigation.addEventListener("click", (event) => {
            if (event.target.closest("a")) {
                menuToggle.setAttribute("aria-expanded", "false");
                menuToggle.setAttribute("aria-label", "메뉴 열기");
                navigation.classList.remove("is-open");
            }
        });
    </script>
